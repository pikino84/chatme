# Evolution API — gateway WhatsApp para ChatMe "WhatsApp Directo" (Phase 22).
# Reemplaza el microservicio chatme-wa-bridge (Baileys custom).
#
# Uso local (dev):  cd deploy/evolution && copy .env.example .env  -> editar -> docker compose up -d
# Uso producción:   igual, en el VPS Contabo. SERVER_URL = URL pública del gateway.
#
# Pinear la imagen a una versión v2 concreta antes de producción.
name: chatme-evolution

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: chatme-evolution-api
    restart: always
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # Persistencia en su propio PostgreSQL (aislado del de ChatMe)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: chatme_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Caché/sesiones en Redis propio
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      # No borrar instancias automáticamente al desconectar
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR}
    depends_on:
      - evolution-postgres
      - evolution-redis
    # Permite que el contenedor alcance a Laravel en el host (webhook).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:16-alpine
    container_name: chatme-evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    container_name: chatme-evolution-redis
    restart: always
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redis:
