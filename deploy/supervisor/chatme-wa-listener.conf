; Supervisor config for `php artisan wa:listen` — consume Redis pub/sub del bridge
; y persiste mensajes/estados de WhatsApp Directo en PostgreSQL.
;
; Deploy:
;   sudo cp deploy/supervisor/chatme-wa-listener.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start chatme-wa-listener
;
; NOTA: requiere que chatme-wa-bridge y Redis estén arriba primero.
; El comando tiene auto-reconexión interna ante timeouts de Predis.

[program:chatme-wa-listener]
command=/usr/bin/php artisan wa:listen
directory=/var/www/chatme.com.mx
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=5
stopsignal=SIGTERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/chatme-wa-listener-stdout.log
stderr_logfile=/var/log/supervisor/chatme-wa-listener-stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
