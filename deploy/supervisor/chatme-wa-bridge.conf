; Supervisor config for the WhatsApp Directo Node bridge (Baileys ↔ Redis).
;
; Deploy:
;   sudo cp deploy/supervisor/chatme-wa-bridge.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start chatme-wa-bridge
;
; Logs: /var/log/supervisor/chatme-wa-bridge-{stdout,stderr}.log
; Estado: sudo supervisorctl status chatme-wa-bridge
; Restart: sudo supervisorctl restart chatme-wa-bridge

[program:chatme-wa-bridge]
command=/usr/bin/node src/index.js
directory=/var/www/chatme.com.mx/chatme-wa-bridge
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=5
stopsignal=SIGINT
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/chatme-wa-bridge-stdout.log
stderr_logfile=/var/log/supervisor/chatme-wa-bridge-stderr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=NODE_ENV="production"
